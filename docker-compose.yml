# Day-1 infrastructure. Start: docker compose up -d   Stop: docker compose down
services:
  qdrant:            # vector database for the docs-search MCP server (RAG)
    image: qdrant/qdrant:v1.13.2
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]

  mlflow:            # experiment tracking + model registry
    image: ghcr.io/mlflow/mlflow:v2.19.0
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports: ["5000:5000"]
    volumes: [mlflow_data:/mlflow]

  prometheus:        # collects live metrics (scan API added later)
    image: prom/prometheus:v3.1.0
    ports: ["9090:9090"]
    volumes: ["./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  grafana:           # dashboards on top of Prometheus
    image: grafana/grafana:11.4.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana:/etc/grafana/provisioning/datasources:ro
    depends_on: [prometheus]

volumes:
  qdrant_data:
  mlflow_data:
  grafana_data:
