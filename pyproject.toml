[project]
name = "injectionlab"
version = "0.1.0"
description = "Measuring how prompt injections spread through AI agents, and how to stop them"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.9.1",
    "langchain-openai>=0.3",
    "mcp>=2.3.0",
    "numpy>=2.4.6",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "qdrant-client>=1.20.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/injectionlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
